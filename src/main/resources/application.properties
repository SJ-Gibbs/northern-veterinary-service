server.port=${PORT:3000}

# ── MySQL ──────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&allowMultiQueries=true
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# ── Spring Session (stored in MySQL) ──────────────────────────────────────────
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=7d
server.servlet.session.cookie.name=nvs.sid
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ── SMTP / Mail ───────────────────────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── File upload limits ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ── App-specific properties ───────────────────────────────────────────────────
app.master-admin-email=${MASTER_ADMIN_EMAIL:info@northernveterinaryservice.co.uk}
app.allow-public-signup=${ALLOW_PUBLIC_SIGNUP:true}
app.site-gate-user=${SITE_GATE_USER:nvs}
app.site-gate-pass=${SITE_GATE_PASS:change-this-site-password}
app.url=${APP_URL:http://localhost:3000}
app.smtp-from=${SMTP_FROM:Northern Veterinary Service <noreply@northernveterinaryservice.co.uk>}
app.uploads-dir=${UPLOADS_DIR:uploads}
app.public-dir=${PUBLIC_DIR:public}
app.trust-proxy=${TRUST_PROXY:false}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.uk.co.northernveterinaryservice=INFO
